# Golden evaluation set for the finance-RAG (SEC 10-K).
# - expected_sources: ticker(s) whose filing SHOULD be retrieved (hit-rate@k).
# - must_include: lowercase substrings expected in the generated answer (--gen).
# - type: factual | comparison | out-of-scope
#   * out-of-scope -> retrieval is expected to be weak (gated == true), no fabrication.

# ---------------- NVIDIA ----------------
- id: nvda-risk
  question: "What are NVIDIA's main risk factors?"
  type: factual
  expected_sources: [NVDA]
  must_include: ["risk"]

- id: nvda-datacenter
  question: "What does NVIDIA say about data center revenue and demand?"
  type: factual
  expected_sources: [NVDA]
  must_include: ["data center"]

- id: nvda-business
  question: "What is NVIDIA's business and what does it sell?"
  type: factual
  expected_sources: [NVDA]
  must_include: []

- id: nvda-competition
  question: "How does NVIDIA describe competition in its markets?"
  type: factual
  expected_sources: [NVDA]
  must_include: []

